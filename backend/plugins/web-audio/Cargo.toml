[package]
name = "web-audio"
version = "2.0.0"
edition = "2021"
description = "JimMusic Web 音频桥：wasm ↔ AudioWorklet 的无锁 SPSC 环形缓冲（SharedArrayBuffer + 原子操作）"

[lib]
name = "web_audio"
crate-type = ["cdylib", "rlib"]

[dependencies]
plugin-abi = { path = "../../plugin-abi" }

# 能力 JSON 序列化（与 core 的 OutputCapabilities 约定一致）。
serde_json = "1"

# wasm-bindgen 桥仅在 wasm32 目标下引入（不会影响原生构建/clippy）。
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
